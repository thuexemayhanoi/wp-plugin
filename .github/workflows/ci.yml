name: CI & Build WordPress ZIP
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-build:
    name: PHP ${{ matrix.php }} / smoke / package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, openssl, zip, simplexml
          tools: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Qwen offline beta technical QA and JavaScript syntax
        run: |
          php qwen-local-writer/tests/quality.php
          node --check qwen-local-writer/assets/qwen-worker.js
          node --check qwen-local-writer/assets/local-writer.js
          python3 scripts/build_qwen.py
          python3 -m zipfile -t dist/qwen-local-writer.zip
      - name: Quick flow smoke tests (mocks; no paid API calls)
        run: php tests/smoke-v120.php
      - name: Build ZIP
        run: python3 scripts/build_plugin.py
      - name: Validate WordPress ZIP layout
        run: |
          python3 -m zipfile -t dist/multi-ai-seo-content-factory.zip
          python3 - <<'PYCODE'
          import zipfile
          name='dist/multi-ai-seo-content-factory.zip'
          with zipfile.ZipFile(name) as f:
              names=f.namelist()
              assert all(n.startswith('multi-ai-seo-content-factory/') for n in names)
              assert 'multi-ai-seo-content-factory/multi-ai-seo-content-factory.php' in names
              assert 'multi-ai-seo-content-factory/vendor/action-scheduler/action-scheduler.php' in names
          print('Installable archive layout verified')
          PYCODE
      - name: Upload installable WordPress ZIP
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: multi-ai-seo-content-factory-wordpress-zip
          path: dist/multi-ai-seo-content-factory.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload separate Qwen Local beta ZIP
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: qwen-local-writer-beta-zip
          path: dist/qwen-local-writer.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish tagged WordPress ZIP
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested ZIP
        uses: actions/download-artifact@v4
        with:
          name: multi-ai-seo-content-factory-wordpress-zip
          path: release
      - name: Validate release version matches plugin source
        run: |
          python3 - <<'PYCODE'
          import re, os, zipfile
          tag=os.environ['GITHUB_REF_NAME']
          z='release/multi-ai-seo-content-factory.zip'
          with zipfile.ZipFile(z) as f:
              main=f.read('multi-ai-seo-content-factory/multi-ai-seo-content-factory.php').decode()
          m=re.search(r'(?m)^ \* Version: (\d+\.\d+\.\d+)', main)
          assert m is not None and tag == 'v' + m.group(1), f'tag {tag} does not match plugin version'
          print('Release version match:', tag)
          PYCODE
      - name: GitHub Release (only tagged commits after QA)
        uses: softprops/action-gh-release@v2
        with:
          files: release/multi-ai-seo-content-factory.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
