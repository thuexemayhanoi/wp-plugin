name: Qwen probe (temporary, not for merge)
on:
  push:
    branches: ['ci/qwen-probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hugging Face model metadata
        run: |
          for m in onnx-community/Qwen3-0.6B-ONNX onnx-community/Qwen3-1.7B-ONNX; do
            echo "== $m"; curl -fsS "https://huggingface.co/api/models/$m" | python3 -c "import sys,json; d=json.load(sys.stdin); print('sha', d.get('sha'), 'license', (d.get('cardData') or {}).get('license'), 'lastModified', d.get('lastModified')); print([s['rfilename'] for s in d.get('siblings',[])])"
            curl -fsS "https://huggingface.co/api/models/$m/tree/main/onnx" | python3 -c "import sys,json; [print(f['path'], f.get('size'), (f.get('lfs') or {}).get('oid')) for f in json.load(sys.stdin)]"
            curl -fsS "https://huggingface.co/api/models/$m/tree/main" | python3 -c "import sys,json; [print(f['path'], f.get('size'), (f.get('lfs') or {}).get('oid') or f.get('oid')) for f in json.load(sys.stdin)]"
          done
      - name: Install probe deps
        working-directory: .github/probe
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @huggingface/transformers@4.3.1 playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p web/vendor
          cp node_modules/@huggingface/transformers/dist/transformers.min.js web/vendor/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.mjs node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.wasm web/vendor/
          nproc; free -g
      - name: Node CPU real inference
        working-directory: .github/probe
        run: node node-probe.mjs
      - name: Browser worker probe (WASM + WebGPU SwiftShader, isolated vs not)
        working-directory: .github/probe
        run: |
          PORT=8790 node server.mjs & PORT=8791 ISOLATE=1 node server.mjs & sleep 1
          RUNS='[[8791,"wasm","q4"],[8790,"wasm","q4"],[8791,"webgpu","q4"]]' timeout 1500 node browser-probe.cjs
